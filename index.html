<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>画像置き場</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    background: #faf6ef;
  }

  .item {
    position: absolute;
    user-select: none;
    -webkit-user-drag: none;
  }
  .item img {
    width: 100%;
    height: auto;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  #taru {
    left: 8vw;
    top: 55vh;
    width: clamp(90px, 17vw, 210px);
    transform: rotate(-4deg);
  }
  #itasya {
    left: 62vw;
    top: 8vh;
    width: clamp(130px, 27vw, 330px);
    transform: rotate(3deg);
  }
  #kama {
    left: 63vw;
    top: 48vh;
    width: clamp(110px, 21vw, 250px);
  }
  #tarte {
    left: 12vw;
    top: 10vh;
    width: clamp(90px, 18vw, 200px);
    cursor: grab;
    touch-action: none;
    z-index: 10;
    transition: filter 0.2s;
  }
  #tarte:hover { filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25)); }
  #tarte.dragging { cursor: grabbing; }
  #tarte.baking {
    transition: transform 0.7s ease-in, opacity 0.7s ease-in;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="item" id="taru"><img src="drink_taru.png" alt=""></div>
<div class="item" id="itasya"><img src="car_itasya.png" alt=""></div>
<div class="item" id="kama"><img src="pizza_nisou_kama.png" alt=""></div>
<div class="item" id="tarte"><img src="sweets_fruit_tarte.png" alt=""></div>

<script>
(function () {
  const tarte = document.getElementById("tarte");
  const kama = document.getElementById("kama");
  let dragging = false, baked = false;
  let offsetX = 0, offsetY = 0;

  tarte.addEventListener("pointerdown", (e) => {
    if (baked) return;
    dragging = true;
    tarte.classList.add("dragging");
    const rect = tarte.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    tarte.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  tarte.addEventListener("pointermove", (e) => {
    if (!dragging || baked) return;
    tarte.style.left = (e.clientX - offsetX) + "px";
    tarte.style.top = (e.clientY - offsetY) + "px";
    checkOverlap();
  });

  tarte.addEventListener("pointerup", () => {
    dragging = false;
    tarte.classList.remove("dragging");
  });

  // タルトの中心がピザ窯に入ったら発動
  function checkOverlap() {
    const t = tarte.getBoundingClientRect();
    const k = kama.getBoundingClientRect();
    const cx = t.left + t.width / 2;
    const cy = t.top + t.height / 2;
    if (cx >= k.left && cx <= k.right && cy >= k.top && cy <= k.bottom) {
      bake();
    }
  }

  // 窯に吸い込まれてから遷移
  function bake() {
    if (baked) return;
    baked = true;
    dragging = false;
    const t = tarte.getBoundingClientRect();
    const k = kama.getBoundingClientRect();
    // 窯の火の位置 (上から4割あたり) へ
    const dx = (k.left + k.width / 2) - (t.left + t.width / 2);
    const dy = (k.top + k.height * 0.42) - (t.top + t.height / 2);
    tarte.classList.add("baking");
    tarte.style.transform = `translate(${dx}px, ${dy}px) scale(0.1) rotate(360deg)`;
    tarte.style.opacity = "0";
    setTimeout(() => { location.href = "omedeto/"; }, 750);
  }
})();
</script>
</body>
</html>
